<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Mouth / happy: 레퍼런스 기본 — 혀 보이는 열린 미소.
       모든 mouth_*.svg는 같은 위치에 등록 — Rive에서 Mouth 노드 아래
       visibility 토글로 전환한다. -->
  <g id="MouthHappy">
    <path id="cavity"
      d="M 235 222 Q 250 227 265 222
