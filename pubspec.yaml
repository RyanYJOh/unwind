name: unwind
description: "하루를 끝내는 앱. 할 일을 지울 때마다 집의 불이 꺼지고, 마지막 불이 꺼지면 Todd가 잠든다."
publish_to: 'none'

version: 1.0.0+33

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # §3.1 스택 — 서버 없음, 로컬 온리
  flutter_riverpod: ^3.0.3
  drift: ^2.28.2
  drift_flutter: ^0.2.7
  sqlite3_flutter_libs: ^0.5.41
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  uuid: ^4.5.2
  intl: ^0.20.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  in_app_review: ^2.0.9
  rive: ^0.14.11
  flutter_timezone: ^5.1.0
  home_widget: ^0.9.3
  mixpanel_flutter: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.3
  build_runner: ^2.7.4
  sqlite3: ^2.9.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/textures/
    - assets/rive/
    - assets/images/

  # §8.2 — 폰트는 앱에 번들, 네트워크 로드 금지
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
